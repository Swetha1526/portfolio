    <!-- Anti-FOUC Theme Initialization Script -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('swetha_portfolio_theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored ? stored : (systemDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var metaTheme = document.getElementById('theme-color-meta');
          if (metaTheme) {
            metaTheme.setAttribute('content', theme === 'dark' ? '#0B0F19' : '#F8F9FC');
          }
        } catch (e) {
          console.error(e);
        }
      })();
    </script>
